name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1つだけ。実行中のデプロイは中断しない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # deploy-pages は待ち時間の上限が10分でハードコードされており
      # （MAX_TIMEOUT = 600000、入力値は Math.min で切り捨てられる）、延長できない。
      # 同じアカウントの他リポジトリが Pages をデプロイ中だと順番待ちが長引き、
      # この10分を超えて中断されることがある。その場合は再実行する。
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
