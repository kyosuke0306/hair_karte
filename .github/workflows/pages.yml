name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1つだけ。実行中のデプロイは中断しない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # deploy-pages は待ち時間の上限が10分でハードコードされていて延長できない
      # （MAX_TIMEOUT = 600000、timeout 入力は Math.min で切り捨てられる）。
      # 上限に達するとデプロイ自体をキャンセルして失敗する。
      # Pages 側が混んでいると10分を超えることがあるため、最大3回まで試す。
      - name: Deploy (1回目)
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Deploy (2回目)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Deploy (3回目)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
