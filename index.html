<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8b5e4c">
<title>ヘアカルテ | 髪型の注文とカット履歴</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- アイコン定義（画面には出さない）。すべて currentColor で描くのでテーマに追従する -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-logo" viewBox="0 0 24 24">
    <g fill="currentColor">
      <rect x="3" y="4.6" width="18" height="3.8" rx="1.6"/>
      <rect x="3.5" y="8.4" width="2.6" height="9.4" rx="1.3"/>
      <rect x="8.3" y="8.4" width="2.6" height="9.4" rx="1.3"/>
      <rect x="13.1" y="8.4" width="2.6" height="9.4" rx="1.3"/>
      <rect x="17.9" y="8.4" width="2.6" height="9.4" rx="1.3"/>
    </g>
  </symbol>

  <symbol id="i-star" viewBox="0 0 24 24">
    <path fill="currentColor" d="M12 2.8l2.85 5.78 6.38.93-4.62 4.5 1.09 6.35L12 17.35l-5.7 3.01 1.09-6.35-4.62-4.5 6.38-.93z"/>
  </symbol>

  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/>
  </symbol>

  <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
    <rect x="8" y="8" width="12" height="12" rx="2.5"/>
    <path d="M16 8V6.5A2.5 2.5 0 0013.5 4h-7A2.5 2.5 0 004 6.5v7A2.5 2.5 0 006.5 16H8"/>
  </symbol>

  <symbol id="i-mask" viewBox="0 0 24 24">
    <g fill="currentColor">
      <rect x="3" y="3" width="5.6" height="5.6" rx="1.1"/>
      <rect x="9.2" y="3" width="5.6" height="5.6" rx="1.1" opacity=".35"/>
      <rect x="15.4" y="3" width="5.6" height="5.6" rx="1.1"/>
      <rect x="3" y="9.2" width="5.6" height="5.6" rx="1.1" opacity=".35"/>
      <rect x="9.2" y="9.2" width="5.6" height="5.6" rx="1.1"/>
      <rect x="15.4" y="9.2" width="5.6" height="5.6" rx="1.1" opacity=".35"/>
      <rect x="3" y="15.4" width="5.6" height="5.6" rx="1.1"/>
      <rect x="9.2" y="15.4" width="5.6" height="5.6" rx="1.1" opacity=".35"/>
      <rect x="15.4" y="15.4" width="5.6" height="5.6" rx="1.1"/>
    </g>
  </symbol>

  <symbol id="i-export" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 15V3.5"/><path d="M7.5 8L12 3.5 16.5 8"/><path d="M4 15v3.5A2.5 2.5 0 006.5 21h11a2.5 2.5 0 002.5-2.5V15"/>
  </symbol>

  <symbol id="i-import" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.5V15"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M4 15v3.5A2.5 2.5 0 006.5 21h11a2.5 2.5 0 002.5-2.5V15"/>
  </symbol>

  <symbol id="i-undo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9h10a5.5 5.5 0 010 11H8"/><path d="M4 9l4.5-4.5M4 9l4.5 4.5"/>
  </symbol>

  <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 4.5L7.5 12l7.5 7.5"/>
  </symbol>

  <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
    <path d="M12 21.5s7-6.2 7-11.5a7 7 0 10-14 0c0 5.3 7 11.5 7 11.5z"/>
    <circle cx="12" cy="10" r="2.6"/>
  </symbol>

  <symbol id="i-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <path d="M10 13.5a4 4 0 006 .5l2.5-2.5a4 4 0 10-5.7-5.7L11.5 7"/>
    <path d="M14 10.5a4 4 0 00-6-.5L5.5 12.5a4 4 0 105.7 5.7L12.5 17"/>
  </symbol>

  <symbol id="i-photo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="18" height="14" rx="2.5"/>
    <circle cx="8.5" cy="10" r="1.6"/>
    <path d="M4.5 17.5l4.6-4.6 3.4 3.4 2.6-2.6 4.4 4.4"/>
  </symbol>
</svg>

<header class="app-header">
  <div class="app-header__inner">
    <h1 class="app-title"><svg class="ico ico--logo" aria-hidden="true"><use href="#i-logo"></use></svg><span>ヘアカルテ</span></h1>
    <nav class="tabs" id="tabs">
      <a class="tab" href="#/list" data-view="list">カルテ</a>
      <a class="tab" href="#/stats" data-view="stats">記録</a>
      <a class="tab" href="#/settings" data-view="settings">設定</a>
    </nav>
  </div>
</header>

<main id="main" class="main"></main>

<button class="fab" id="fab" type="button" title="新しいカルテを追加">＋</button>

<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox__close" type="button" aria-label="閉じる">×</button>
  <img class="lightbox__img" alt="">
  <p class="lightbox__cap" hidden></p>
</div>

<div class="toast" id="toast" hidden></div>

<!-- 顔隠しエディタ -->
<div class="editor" id="editor" hidden>
  <div class="editor__bar">
    <button class="btn btn--ghost" type="button" data-act="cancel">キャンセル</button>
    <span class="editor__title">顔を隠す</span>
    <button class="btn btn--primary" type="button" data-act="apply">適用</button>
  </div>

  <div class="editor__stage">
    <canvas id="editor-canvas"></canvas>
  </div>

  <div class="editor__tools">
    <button class="btn btn--auto" type="button" data-act="auto"><svg class="ico" aria-hidden="true"><use href="#i-mask"></use></svg>自動で顔を検出して隠す</button>

    <div class="editor__row">
      <span class="editor__label">隠し方</span>
      <div class="segmented">
        <button class="seg is-on" type="button" data-style="mosaic">モザイク</button>
        <button class="seg" type="button" data-style="blur">ぼかし</button>
        <button class="seg" type="button" data-style="fill">ぬりつぶし</button>
      </div>
    </div>

    <div class="editor__row">
      <span class="editor__label">形</span>
      <div class="segmented">
        <button class="seg is-on" type="button" data-shape="ellipse">丸</button>
        <button class="seg" type="button" data-shape="rect">四角</button>
      </div>
      <span class="editor__count" data-f="count"></span>
    </div>

    <div class="editor__row editor__row--end">
      <button class="btn btn--small" type="button" data-act="undo"><svg class="ico" aria-hidden="true"><use href="#i-undo"></use></svg>ひとつ戻す</button>
      <button class="btn btn--small" type="button" data-act="clear">すべて消す</button>
    </div>

    <p class="editor__hint" data-f="hint"></p>
  </div>
</div>

<!-- Googleマップのリンクを取り込むシート -->
<div class="sheet" id="mapsheet" hidden>
  <div class="sheet__scrim" data-act="close"></div>
  <div class="sheet__panel" role="dialog" aria-modal="true">
    <div class="sheet__head">
      <div>
        <h3 class="sheet__title">Googleマップから取り込む</h3>
        <p class="sheet__hint">お店の場所とリンクを記録します</p>
      </div>
      <button class="btn btn--ghost" type="button" data-act="close">閉じる</button>
    </div>

    <ol class="steps">
      <li>Googleマップでお店を開く</li>
      <li>「共有」→「リンクをコピー」</li>
      <li>下の欄に貼り付ける</li>
    </ol>

    <label class="field">
      <span class="field__label">コピーした内容</span>
      <textarea class="input" data-f="paste" rows="3"
                placeholder="https://maps.app.goo.gl/… を貼り付け"></textarea>
    </label>

    <div class="mapresult" data-f="result" hidden></div>

    <div class="sheet__foot">
      <button class="btn" type="button" data-act="close">キャンセル</button>
      <button class="btn btn--primary" type="button" data-act="apply">取り込む</button>
    </div>
  </div>
</div>

<!-- ============ テンプレート ============ -->

<template id="tpl-list">
  <section class="view">
    <div class="summary" id="summary"></div>

    <div class="filterbar">
      <div class="searchbox">
        <svg class="ico searchbox__ico" aria-hidden="true"><use href="#i-search"></use></svg>
        <input type="search" id="q" class="input input--search" placeholder="スタイル名・店名で検索">
      </div>
      <select id="sort" class="input input--sort">
        <option value="date-desc">新しい順</option>
        <option value="date-asc">古い順</option>
        <option value="rating-desc">評価が高い順</option>
      </select>
    </div>

    <div class="cards" id="cards"></div>

    <div class="empty" id="empty" hidden>
      <p class="empty__icon"><svg class="ico ico--empty" aria-hidden="true"><use href="#i-logo"></use></svg></p>
      <p class="empty__title">まだカルテがありません</p>
      <p class="empty__text">右下の「＋」から、切った日・お店・注文の仕方を記録しましょう。</p>
      <button class="btn btn--primary" data-action="new">最初のカルテを作る</button>
    </div>
  </section>
</template>

<template id="tpl-detail">
  <section class="view">
    <div class="detail-head">
      <button class="btn btn--ghost" data-action="back"><svg class="ico" aria-hidden="true"><use href="#i-back"></use></svg>一覧</button>
      <div class="detail-head__actions">
        <button class="btn btn--ghost" data-action="duplicate">この内容で新規</button>
        <button class="btn" data-action="edit">編集</button>
      </div>
    </div>

    <article class="detail">
      <div class="detail__title">
        <h2 class="detail__style" data-f="styleName"></h2>
        <div class="detail__stars" data-f="rating"></div>
      </div>
      <p class="detail__meta" data-f="meta"></p>
      <p class="detail__map" data-f="maplink" hidden></p>

      <section class="panel panel--order">
        <div class="panel__head">
          <h3 class="panel__title">注文の仕方</h3>
          <button class="btn btn--small" data-action="copy-order"><svg class="ico" aria-hidden="true"><use href="#i-copy"></use></svg>注文シートをコピー</button>
        </div>

        <div id="detail-headmap"></div>

        <dl class="speclist speclist--extra" data-f="specs"></dl>
        <div class="notebox" data-f="orderNote" hidden></div>

        <details class="foldout">
          <summary class="foldout__head">美容室で見せる文章</summary>
          <div class="orderpaper" data-f="orderPaper"></div>
        </details>
      </section>

      <section class="panel">
        <h3 class="panel__title">写真</h3>
        <div class="photogroup">
          <h4 class="photogroup__label">参考モデル</h4>
          <div class="thumbs" data-f="photos-ref"></div>
        </div>
        <div class="photogroup">
          <h4 class="photogroup__label">自分</h4>
          <div class="thumbs" data-f="photos-self"></div>
        </div>
      </section>

      <section class="panel">
        <h3 class="panel__title">自己評価</h3>
        <div class="review" data-f="review"></div>
      </section>

      <section class="panel panel--danger">
        <button class="btn btn--danger" data-action="delete">このカルテを削除</button>
      </section>
    </article>
  </section>
</template>

<template id="tpl-form">
  <section class="view">
    <form class="form" id="form" novalidate>
      <div class="form-head">
        <button class="btn btn--ghost" type="button" data-action="cancel"><svg class="ico" aria-hidden="true"><use href="#i-back"></use></svg>戻る</button>
        <h2 class="form-head__title" id="form-title">新しいカルテ</h2>
        <button class="btn btn--primary" type="submit">保存</button>
      </div>

      <fieldset class="fs">
        <legend class="fs__legend">いつ・どこで切ったか</legend>
        <div class="grid grid--pair">
          <label class="field">
            <span class="field__label">カットした日 <b class="req">必須</b></span>
            <input class="input" type="date" name="date" required>
          </label>
          <label class="field">
            <span class="field__label">料金（円）</span>
            <input class="input" type="number" name="price" inputmode="numeric" min="0" step="10" placeholder="5500">
          </label>
        </div>
        <label class="field field--mt">
          <span class="field__label">お店の名前</span>
          <input class="input" type="text" name="salon" list="dl-salon" placeholder="例）HAIR SALON ○○">
          <datalist id="dl-salon"></datalist>
        </label>

        <input type="hidden" name="mapUrl">
        <input type="hidden" name="lat">
        <input type="hidden" name="lng">

        <div class="maprow">
          <button class="btn btn--small" type="button" data-action="map-search">
            <svg class="ico" aria-hidden="true"><use href="#i-pin"></use></svg>Googleマップで探す
          </button>
          <button class="btn btn--small" type="button" data-action="map-paste">
            <svg class="ico" aria-hidden="true"><use href="#i-link"></use></svg>マップのリンクを貼り付け
          </button>
        </div>
        <div class="maplinked" data-f="maplinked" hidden>
          <span class="maplinked__text">
            <svg class="ico" aria-hidden="true"><use href="#i-pin"></use></svg>
            <span data-f="maplabel"></span>
          </span>
          <button class="btn btn--small" type="button" data-action="map-clear">解除</button>
        </div>

        <details class="foldout">
          <summary class="foldout__head">店舗・担当スタイリストも記録する</summary>
          <div class="grid grid--pair">
            <label class="field">
              <span class="field__label">店舗・エリア</span>
              <input class="input" type="text" name="area" list="dl-area" placeholder="渋谷店">
              <datalist id="dl-area"></datalist>
            </label>
            <label class="field">
              <span class="field__label">担当スタイリスト</span>
              <input class="input" type="text" name="stylist" list="dl-stylist" placeholder="田中さん">
              <datalist id="dl-stylist"></datalist>
            </label>
          </div>
        </details>
      </fieldset>

      <fieldset class="fs">
        <legend class="fs__legend">髪型の注文</legend>
        <div id="form-headmap"></div>
        <p class="hm__hint">図の部位をタップして、ミリ数や長さを選べます。</p>

        <div class="grid field--mt">
          <label class="field">
            <span class="field__label">ヘアスタイル名称</span>
            <select class="input" name="styleSelect">
              <option value="">選択しない</option>
              <optgroup label="これまでに使ったスタイル" id="og-used"></optgroup>
              <optgroup label="ベリーショート系">
                <option>ベリーショート</option>
                <option>ソフトモヒカン</option>
                <option>フェード（スキンフェード）</option>
                <option>刈り上げショート</option>
                <option>ベリーショート × ツーブロック</option>
              </optgroup>
              <optgroup label="ショート系">
                <option>ショート</option>
                <option>マッシュショート</option>
                <option>ツーブロック</option>
                <option>ツーブロック × マッシュショート</option>
                <option>センターパート</option>
                <option>アップバング</option>
                <option>ショートボブ</option>
              </optgroup>
              <optgroup label="ミディアム系">
                <option>ミディアム</option>
                <option>レイヤーミディアム</option>
                <option>ボブ</option>
                <option>ウルフカット</option>
                <option>パーマスタイル</option>
              </optgroup>
              <optgroup label="ロング系">
                <option>セミロング</option>
                <option>ロング</option>
                <option>ロングレイヤー</option>
              </optgroup>
              <option value="__other">その他（自由に入力）</option>
            </select>
            <input class="input field--mt" type="text" name="styleName" hidden
                   placeholder="スタイル名を入力">
          </label>
          <label class="field">
            <span class="field__label">仕上がりの長さ感</span>
            <select class="input" name="lengthGenre">
              <option value="">選択しない</option>
              <option>ベリーショート</option>
              <option>ショート</option>
              <option>ミディアム</option>
              <option>セミロング</option>
              <option>ロング</option>
            </select>
          </label>
        </div>

        <input type="hidden" name="sideMm">
        <input type="hidden" name="backMm">
        <input type="hidden" name="sideburnMm">
        <input type="hidden" name="topLen">
        <input type="hidden" name="frontLen">
        <input type="hidden" name="fadeHeight">

        <details class="foldout">
          <summary class="foldout__head">パーマ・カラー・すき具合を記録する</summary>
        <div class="grid">
          <label class="field">
            <span class="field__label">すき具合（量感調整）</span>
            <select class="input" name="thinning">
              <option value="">選択しない</option>
              <option>すかない</option>
              <option>少なめにすく</option>
              <option>ふつう</option>
              <option>しっかりすく</option>
            </select>
          </label>
          <label class="field">
            <span class="field__label">パーマ</span>
            <input class="input" type="text" name="perm" placeholder="例）ツイストスパイラル">
          </label>
          <label class="field">
            <span class="field__label">カラー</span>
            <input class="input" type="text" name="color" placeholder="例）8トーン アッシュベージュ">
          </label>
          <label class="field">
            <span class="field__label">セット・スタイリング剤</span>
            <input class="input" type="text" name="styling" placeholder="例）マット系ワックス">
          </label>
          <label class="field field--wide">
            <span class="field__label">伝えたこと・注文メモ</span>
            <textarea class="input" name="orderNote" rows="3" placeholder="そのまま言えるように書いておくと便利です"></textarea>
          </label>
        </div>
        </details>
      </fieldset>

      <fieldset class="fs">
        <legend class="fs__legend">写真</legend>
        <div class="photo-editors">
          <div class="photo-editor" data-kind="ref">
            <h4 class="sub">参考モデルの写真</h4>
            <div class="thumbs thumbs--edit" data-slot="ref"></div>
            <label class="btn btn--upload">
              画像を選ぶ
              <input type="file" accept="image/*" multiple hidden data-upload="ref">
            </label>
          </div>
          <div class="photo-editor" data-kind="self">
            <h4 class="sub">自分の写真（仕上がり）</h4>
            <div class="thumbs thumbs--edit" data-slot="self"></div>
            <label class="btn btn--upload">
              画像を選ぶ / 撮影
              <input type="file" accept="image/*" multiple hidden data-upload="self">
            </label>
          </div>
        </div>
        <p class="hint">写真ごとに「向きを選ぶ」から前・後ろ・横などを付けられます。「顔を隠す」ではモザイク・ぼかし・ぬりつぶしで顔を隠せます。</p>
      </fieldset>

      <fieldset class="fs">
        <legend class="fs__legend">自己評価</legend>
        <div class="field">
          <span class="field__label">満足度</span>
          <div class="stars-input" id="stars-input">
            <button type="button" class="star" data-v="1" aria-label="満足度1"><svg class="ico star__ico" aria-hidden="true"><use href="#i-star"></use></svg></button>
            <button type="button" class="star" data-v="2" aria-label="満足度2"><svg class="ico star__ico" aria-hidden="true"><use href="#i-star"></use></svg></button>
            <button type="button" class="star" data-v="3" aria-label="満足度3"><svg class="ico star__ico" aria-hidden="true"><use href="#i-star"></use></svg></button>
            <button type="button" class="star" data-v="4" aria-label="満足度4"><svg class="ico star__ico" aria-hidden="true"><use href="#i-star"></use></svg></button>
            <button type="button" class="star" data-v="5" aria-label="満足度5"><svg class="ico star__ico" aria-hidden="true"><use href="#i-star"></use></svg></button>
            <span class="stars-input__label" id="stars-label">未評価</span>
          </div>
          <input type="hidden" name="rating" value="0">
        </div>
        <details class="foldout">
          <summary class="foldout__head">よかった点・次回へのメモを書く</summary>
        <div class="grid">
          <label class="field field--wide">
            <span class="field__label">よかった点</span>
            <textarea class="input" name="good" rows="2" placeholder="サイドの刈り上げの高さがちょうどよかった"></textarea>
          </label>
          <label class="field field--wide">
            <span class="field__label">いまいちだった点</span>
            <textarea class="input" name="bad" rows="2" placeholder="トップを切りすぎてセットしにくい"></textarea>
          </label>
          <label class="field field--wide">
            <span class="field__label">次回はこうする</span>
            <textarea class="input" name="next" rows="2" placeholder="次はトップを2cm長めに残してもらう"></textarea>
          </label>
        </div>
        </details>
      </fieldset>

      <div class="form-foot">
        <button class="btn btn--primary btn--block" type="submit">保存する</button>
      </div>
    </form>
  </section>
</template>

<template id="tpl-stats">
  <section class="view">
    <h2 class="view__title">記録のふりかえり</h2>
    <div class="statgrid" id="statgrid"></div>

    <section class="panel">
      <h3 class="panel__title">カットの間隔</h3>
      <div class="chart" id="chart-interval"></div>
    </section>

    <section class="panel">
      <h3 class="panel__title">よく行くお店</h3>
      <div class="ranking" id="rank-salon"></div>
    </section>

    <section class="panel">
      <h3 class="panel__title">評価の高かったスタイル</h3>
      <div class="ranking" id="rank-style"></div>
    </section>
  </section>
</template>

<template id="tpl-settings">
  <section class="view">
    <h2 class="view__title">設定</h2>

    <section class="panel">
      <h3 class="panel__title">バックアップ</h3>
      <p class="panel__text">データはこの端末のブラウザ内だけに保存されます。機種変更の前や、念のための保存にはエクスポートを使ってください（写真も含まれます）。</p>
      <div class="btnrow">
        <button class="btn" data-action="export"><svg class="ico" aria-hidden="true"><use href="#i-export"></use></svg>エクスポート（JSON）</button>
        <label class="btn btn--upload">
          <svg class="ico" aria-hidden="true"><use href="#i-import"></use></svg>インポート
          <input type="file" accept="application/json,.json" hidden data-action="import">
        </label>
      </div>
    </section>

    <section class="panel">
      <h3 class="panel__title">表示</h3>
      <label class="field">
        <span class="field__label">テーマ</span>
        <select class="input" id="theme-select">
          <option value="auto">端末の設定に合わせる</option>
          <option value="light">ライト</option>
          <option value="dark">ダーク</option>
        </select>
      </label>
    </section>

    <section class="panel">
      <h3 class="panel__title">保存の状況</h3>
      <div class="speclist" id="storage-info"></div>
    </section>

    <section class="panel panel--danger">
      <h3 class="panel__title">データの全消去</h3>
      <p class="panel__text">すべてのカルテと写真が消えます。元に戻せません。</p>
      <button class="btn btn--danger" data-action="wipe">すべて削除する</button>
    </section>
  </section>
</template>

<script src="js/db.js"></script>
<script src="js/photos.js"></script>
<script src="js/mask.js"></script>
<script src="js/head.js"></script>
<script src="js/maps.js"></script>
<script src="js/app.js"></script>
</body>
</html>
